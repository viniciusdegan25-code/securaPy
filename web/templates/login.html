{% extends "base.html" %}
{% block titulo %}Entrar · SecuraPy{% endblock %}
{% block conteudo %}
<section class="login-card">
  <p class="eyebrow">ACESSO RESTRITO</p>
  <h1>Entrar no console</h1>
  <p class="muted">Use sua conta de operador SecuraPy.</p>
  <form method="post" action="{{ url_for('autenticar_operador', proxima=request.args.get('proxima', '')) }}" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required maxlength="150">
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required maxlength="200">
    <button class="primary" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
